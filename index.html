<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ปฏิทินจองทีมช่าง</title>
  <style>
    :root {
      --navy: #18324b;
      --blue: #3978f6;
      --bg: #f4f7fb;
      --muted: #718096;
      --border: #e3eaf2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--navy);
      background: var(--bg);
      font-family: "Noto Sans Thai", Tahoma, Arial, sans-serif;
    }

    button, input, select { font: inherit; }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 22px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 5px 18px #18324b12;
      font-size: 29px;
    }

    h1 { margin: 0; font-size: 24px; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 14px; }

    .primary-btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      color: white;
      background: var(--blue);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 14px #3978f633;
    }

    .primary-btn:hover { background: #2867e8; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 17px 19px;
    }

    .summary-label { color: var(--muted); font-size: 13px; }
    .summary-value { margin-top: 5px; font-size: 25px; font-weight: 800; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 18px;
      align-items: start;
    }

    .calendar-panel, .side-panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 7px 22px #18324b08;
    }

    .calendar-panel { padding: 18px; }

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 17px;
    }

    .month-title { font-size: 20px; font-weight: 800; }
    .month-controls { display: flex; gap: 8px; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      cursor: pointer;
      color: var(--navy);
    }

    .icon-btn:hover { background: #f5f8fc; }

    .weekdays, .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekday {
      padding: 9px 4px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .day {
      position: relative;
      min-height: 112px;
      padding: 9px;
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      cursor: pointer;
      background: white;
    }

    .day:nth-child(7n) { border-right: 0; }
    .day.empty { cursor: default; background: #fbfcfe; }
    .day:hover:not(.empty) { background: #f8fbff; }

    .day.today .day-number {
      display: inline-grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      color: white;
      background: var(--blue);
    }

    .day-number { font-size: 14px; font-weight: 700; }

    .job-preview {
      display: block;
      margin-top: 6px;
      padding: 4px 6px;
      overflow: hidden;
      border-radius: 6px;
      color: #25415d;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .more-jobs {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .tooltip {
      display: none;
      position: absolute;
      z-index: 5;
      top: 35px;
      left: 8px;
      width: min(285px, calc(100vw - 55px));
      max-height: 275px;
      overflow: auto;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      box-shadow: 0 12px 30px #18324b24;
      cursor: default;
    }

    .day:hover .tooltip { display: block; }
    .tooltip-title { margin-bottom: 8px; font-weight: 800; }
    .tooltip-empty { color: var(--muted); font-size: 13px; }

    .tooltip-job {
      padding: 8px 0;
      border-top: 1px solid #edf1f6;
      font-size: 12px;
      line-height: 1.55;
    }

    .tooltip-job strong { display: block; font-size: 13px; }
    .tooltip-meta { color: var(--muted); }

    .delete-btn {
      margin-top: 7px;
      padding: 5px 9px;
      border: 1px solid #ffd5d5;
      border-radius: 7px;
      color: #c33;
      background: #fff7f7;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-btn:hover { background: #ffeaea; }

    .side-panel { padding: 18px; }
    .side-panel h2 { margin: 0 0 5px; font-size: 17px; }
    .side-intro { margin: 0 0 14px; color: var(--muted); font-size: 13px; }

    .mascot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      margin-bottom: 17px;
      border-radius: 14px;
      background: #fff5e5;
    }

    .mascot-face { font-size: 39px; }
    .mascot-copy { font-size: 13px; line-height: 1.5; }
    .mascot-copy strong { display: block; font-size: 14px; }

    .team-list { display: grid; gap: 9px; }

    .team-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      font-size: 13px;
    }

    .team-dot {
      width: 11px;
      height: 11px;
      flex: 0 0 11px;
      border-radius: 50%;
    }

    .team-count {
      margin-left: auto;
      color: var(--muted);
      font-weight: 700;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #10243b88;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(480px, 100%);
      padding: 23px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 20px 60px #0003;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-head h2 { margin: 0; font-size: 20px; }

    .close-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 25px;
      cursor: pointer;
    }

    .form-grid { display: grid; gap: 12px; }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #d6dfeb;
      border-radius: 9px;
      outline: none;
      background: white;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #3978f61c;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 17px;
    }

    .secondary-btn {
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .side-panel { order: -1; }
    }

    @media (max-width: 600px) {
      .app { padding: 18px 10px 28px; }
      .topbar { align-items: flex-start; }
      h1 { font-size: 19px; }
      .primary-btn { padding: 10px 12px; font-size: 13px; }
      .summary { gap: 8px; }
      .summary-card { padding: 12px; }
      .summary-value { font-size: 20px; }
      .calendar-panel { padding: 10px; }
      .day { min-height: 79px; padding: 5px; }
      .job-preview { font-size: 9px; padding: 3px 4px; }
      .more-jobs { font-size: 9px; }
      .weekday { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🛠️</div>
        <div>
          <h1>ปฏิทินจองทีมช่าง</h1>
          <div class="subtitle">ดูตารางงานและวางแผนทีมช่างของคุณ</div>
        </div>
      </div>
      <button class="primary-btn" id="openBooking">＋ จองช่าง</button>
    </header>

    <section class="summary">
      <div class="summary-card">
        <div class="summary-label">งานทั้งหมดในเดือนนี้</div>
        <div class="summary-value" id="monthJobCount">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">ทีมที่มีงานในเดือนนี้</div>
        <div class="summary-value" id="activeTeamCount">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">วันที่มีงานในเดือนนี้</div>
        <div class="summary-value" id="busyDayCount">0</div>
      </div>
    </section>

    <section class="layout">
      <section class="calendar-panel">
        <div class="calendar-head">
          <div class="month-title" id="monthTitle"></div>
          <div class="month-controls">
            <button class="icon-btn" id="prevMonth" aria-label="เดือนก่อน">‹</button>
            <button class="icon-btn" id="todayBtn">วันนี้</button>
            <button class="icon-btn" id="nextMonth" aria-label="เดือนถัดไป">›</button>
          </div>
        </div>

        <div class="weekdays">
          <div class="weekday">จันทร์</div>
          <div class="weekday">อังคาร</div>
          <div class="weekday">พุธ</div>
          <div class="weekday">พฤหัสบดี</div>
          <div class="weekday">ศุกร์</div>
          <div class="weekday">เสาร์</div>
          <div class="weekday">อาทิตย์</div>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <aside class="side-panel">
        <div class="mascot">
          <div class="mascot-face">👷🏻‍♂️</div>
          <div class="mascot-copy">
            <strong>ทีมช่างพร้อมลุย!</strong>
            จองวันทำงานและติดตามงานได้ที่นี่
          </div>
        </div>
        <h2>งานแยกตามทีม</h2>
        <p class="side-intro">จำนวนงานของแต่ละทีมในเดือนที่กำลังดู</p>
        <div class="team-list" id="teamList"></div>
      </aside>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">จองทีมช่าง</h2>
        <button class="close-btn" id="closeModal" aria-label="ปิด">×</button>
      </div>

      <form id="bookingForm">
        <div class="form-grid">
          <label>
            วันที่ทำงาน
            <input type="date" id="jobDate" required />
          </label>
          <label>
            ทีมช่าง
            <select id="jobTeam" required></select>
          </label>
          <label>
            ชื่อโครงการ
            <input type="text" id="projectName" placeholder="เช่น โครงการปรับปรุงอาคาร" required />
          </label>
          <label>
            ชื่อเจ้าของงาน
            <input type="text" id="ownerName" placeholder="ชื่อผู้รับผิดชอบโครงการ" required />
          </label>
          <label>
            ผู้มอบหมายงาน
            <input type="text" id="assignedBy" placeholder="ชื่อผู้มอบหมายงาน" required />
          </label>
        </div>

        <div class="form-actions">
          <button type="button" class="secondary-btn" id="cancelBooking">ยกเลิก</button>
          <button type="submit" class="primary-btn">บันทึกการจอง</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    const TEAMS = [
      { name: "ทีมวิชัย", color: "#f6ad3c" },
      { name: "ทีมเต้ย", color: "#38a3d1" },
      { name: "ทีมอั๊น", color: "#55b98a" },
      { name: "ทีมอุ๊ย", color: "#9270db" },
      { name: "ทีมโหน่ง", color: "#e57373" },
      { name: "ทีมคุณหมวย", color: "#26a69a" }
    ];

    const STORAGE_KEY = "technicianCalendarBookings";
    let bookings = loadBookings();
    let visibleMonth = new Date();
    visibleMonth.setDate(1);

    const grid = document.getElementById("calendarGrid");
    const modal = document.getElementById("modalBackdrop");
    const form = document.getElementById("bookingForm");

    function loadBookings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        const oldTeamNames = {
          "ทีมไฟฟ้า": "ทีมวิชัย",
          "ทีมประปา": "ทีมเต้ย",
          "ทีมแอร์": "ทีมอั๊น",
          "ทีมซ่อมบำรุง": "ทีมอุ๊ย"
        };

        let changed = false;

        const updated = saved.map(job => {
          const newTeamName = oldTeamNames[job.team];

          if (newTeamName) {
            changed = true;
            return { ...job, team: newTeamName };
          }

          return job;
        });

        if (changed) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
        }

        return updated;
      } catch (error) {
        console.error("อ่านข้อมูลการจองไม่สำเร็จ:", error);
        return [];
      }
    }

    function saveBookings() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
    }

    function localDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function teamColor(teamName) {
      return TEAMS.find(team => team.name === teamName)?.color || "#3978f6";
    }

    function formatDate(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      return new Date(year, month - 1, day).toLocaleDateString("th-TH", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function bookingsInMonth() {
      const year = visibleMonth.getFullYear();
      const month = visibleMonth.getMonth();

      return bookings.filter(job => {
        const [jobYear, jobMonth] = job.date.split("-").map(Number);
        return jobYear === year && jobMonth === month + 1;
      });
    }

    function render() {
      renderCalendar();
      renderSummary();
      renderTeams();
    }

    function renderCalendar() {
      const year = visibleMonth.getFullYear();
      const month = visibleMonth.getMonth();

      document.getElementById("monthTitle").textContent =
        visibleMonth.toLocaleDateString("th-TH", {
          month: "long",
          year: "numeric"
        });

      grid.innerHTML = "";

      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const mondayOffset = (firstDay.getDay() + 6) % 7;

      for (let i = 0; i < mondayOffset; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        grid.appendChild(empty);
      }

      for (let dayNumber = 1; dayNumber <= daysInMonth; dayNumber++) {
        const date = new Date(year, month, dayNumber);
        const dateKey = localDateString(date);
        const dayJobs = bookings.filter(job => job.date === dateKey);

        const cell = document.createElement("div");
        cell.className = "day";

        if (dateKey === localDateString(new Date())) {
          cell.classList.add("today");
        }

        const dayNumberElement = document.createElement("span");
        dayNumberElement.className = "day-number";
        dayNumberElement.textContent = dayNumber;
        cell.appendChild(dayNumberElement);

        dayJobs.slice(0, 2).forEach(job => {
          const preview = document.createElement("span");
          preview.className = "job-preview";
          preview.style.background = `${teamColor(job.team)}22`;
          preview.textContent = `${job.team} · ${job.project}`;
          cell.appendChild(preview);
        });

        if (dayJobs.length > 2) {
          const more = document.createElement("div");
          more.className = "more-jobs";
          more.textContent = `+ อีก ${dayJobs.length - 2} งาน`;
          cell.appendChild(more);
        }

        const tooltip = document.createElement("div");
        tooltip.className = "tooltip";
        tooltip.addEventListener("click", event => event.stopPropagation());

        const tooltipTitle = document.createElement("div");
        tooltipTitle.className = "tooltip-title";
        tooltipTitle.textContent = `${formatDate(dateKey)} · ${dayJobs.length} งาน`;
        tooltip.appendChild(tooltipTitle);

        if (dayJobs.length === 0) {
          const emptyText = document.createElement("div");
          emptyText.className = "tooltip-empty";
          emptyText.textContent = "ยังไม่มีงานในวันนี้";
          tooltip.appendChild(emptyText);
        } else {
          dayJobs.forEach(job => {
            const item = document.createElement("div");
            item.className = "tooltip-job";

            const details = document.createElement("div");
            details.innerHTML = `
              <strong>${escapeHtml(job.team)} — ${escapeHtml(job.project)}</strong>
              <div class="tooltip-meta">เจ้าของงาน: ${escapeHtml(job.owner)}</div>
              <div class="tooltip-meta">มอบหมายโดย: ${escapeHtml(job.assignedBy)}</div>
            `;
            item.appendChild(details);

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "ลบงาน";

            deleteButton.addEventListener("click", event => {
              event.stopPropagation();

              const confirmed = confirm(
                `ต้องการลบงาน "${job.project}" ใช่หรือไม่?`
              );

              if (!confirmed) return;

              bookings = bookings.filter(savedJob => savedJob !== job);
              saveBookings();
              render();
            });

            item.appendChild(deleteButton);
            tooltip.appendChild(item);
          });
        }

        cell.appendChild(tooltip);
        cell.addEventListener("click", () => openBooking(dateKey));
        grid.appendChild(cell);
      }
    }

    function renderSummary() {
      const monthJobs = bookingsInMonth();

      document.getElementById("monthJobCount").textContent = monthJobs.length;
      document.getElementById("activeTeamCount").textContent =
        new Set(monthJobs.map(job => job.team)).size;
      document.getElementById("busyDayCount").textContent =
        new Set(monthJobs.map(job => job.date)).size;
    }

    function renderTeams() {
      const monthJobs = bookingsInMonth();
      const list = document.getElementById("teamList");
      list.innerHTML = "";

      TEAMS.forEach(team => {
        const count = monthJobs.filter(job => job.team === team.name).length;
        const item = document.createElement("div");
        item.className = "team-item";
        item.innerHTML = `
          <span class="team-dot" style="background:${team.color}"></span>
          <span>${team.name}</span>
          <span class="team-count">${count} งาน</span>
        `;
        list.appendChild(item);
      });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function openBooking(date = localDateString(new Date())) {
      form.reset();
      document.getElementById("jobDate").value = date;
      modal.classList.add("open");
      document.getElementById("projectName").focus();
    }

    function closeBooking() {
      modal.classList.remove("open");
      form.reset();
    }

    document.getElementById("jobTeam").innerHTML = TEAMS
      .map(team =>
        `<option value="${escapeHtml(team.name)}">${escapeHtml(team.name)}</option>`
      )
      .join("");

    document.getElementById("openBooking")
      .addEventListener("click", () => openBooking());

    document.getElementById("closeModal")
      .addEventListener("click", closeBooking);

    document.getElementById("cancelBooking")
      .addEventListener("click", closeBooking);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeBooking();
    });

    form.addEventListener("submit", event => {
      event.preventDefault();

      const newBooking = {
        id: globalThis.crypto?.randomUUID?.() || String(Date.now()),
        date: document.getElementById("jobDate").value,
        team: document.getElementById("jobTeam").value,
        project: document.getElementById("projectName").value.trim(),
        owner: document.getElementById("ownerName").value.trim(),
        assignedBy: document.getElementById("assignedBy").value.trim()
      };

      bookings.push(newBooking);
      saveBookings();
      closeBooking();
      render();
    });

    document.getElementById("prevMonth").addEventListener("click", () => {
      visibleMonth.setMonth(visibleMonth.getMonth() - 1);
      render();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      visibleMonth.setMonth(visibleMonth.getMonth() + 1);
      render();
    });

    document.getElementById("todayBtn").addEventListener("click", () => {
      visibleMonth = new Date();
      visibleMonth.setDate(1);
      render();
    });

    render();
  </script>
</body>
</html>
